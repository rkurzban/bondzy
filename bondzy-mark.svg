<svg width="200" height="240" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Navy background for preview -->
  <rect width="100" height="120" fill="#1B2A4A" rx="10"/>
  <!-- Pin head: sweep=1 draws the top arc (sweep=0 was drawing the bottom half) -->
  <path d="M56,44 Q40,38 40,20 A16,16 0 0,1 72,20 Q72,38 56,44Z" fill="#D4A843"/>
  <!-- Clock face -->
  <circle cx="56" cy="20" r="7" fill="white"/>
  <!-- Clock hands -->
  <line x1="56" y1="20" x2="52" y2="14" stroke="#D4A843" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="20" x2="62" y2="22" stroke="#D4A843" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body -->
  <path d="M56,44 Q46,60 40,76" stroke="#D4A843" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Forward arm (upper-left) -->
  <path d="M50,55 Q33,46 18,38" stroke="#D4A843" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Back arm (lower-right) -->
  <path d="M50,55 Q65,64 78,70" stroke="#D4A843" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Forward leg (lower-left stride) -->
  <path d="M40,76 Q25,95 16,112" stroke="#D4A843" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Back leg: thigh goes right-down to knee, lower leg kicks up-right -->
  <path d="M40,76 Q54,86 62,90 Q74,84 76,72" stroke="#D4A843" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
